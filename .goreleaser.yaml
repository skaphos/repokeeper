version: 2

project_name: repokeeper

builds:
  - id: repokeeper
    main: .
    binary: repokeeper
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/skaphos/repokeeper/cmd/repokeeper.Version={{.Version}}
      - -X github.com/skaphos/repokeeper/cmd/repokeeper.Commit={{.Commit}}
      - -X github.com/skaphos/repokeeper/cmd/repokeeper.Date={{.Date}}

# macOS code signing + notarization, cross-platform via quill (no Mac runner
# required). Auto-skipped unless all five MACOS_* secrets are set, so local/
# snapshot builds and forks without the secrets are unaffected. Runs after build
# and before archive, so the signed+notarized binary is what gets tarred,
# checksummed, SBOM'd, and cosign-signed.
notarize:
  macos:
    - enabled: >-
        {{ and (isEnvSet "MACOS_SIGN_P12") (isEnvSet "MACOS_SIGN_PASSWORD")
        (isEnvSet "MACOS_NOTARY_ISSUER_ID") (isEnvSet "MACOS_NOTARY_KEY_ID")
        (isEnvSet "MACOS_NOTARY_KEY") }}
      ids:
        - repokeeper
      sign:
        # base64-encoded Developer ID Application .p12 (certificate + private key)
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        # App Store Connect API key (issuer UUID, key ID, base64-encoded .p8)
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - third_party_licenses/**

# Linux OS packages. Required for Shape 2 by skaphos-resources DECISIONS/0001,
# built from the same binaries as the archives and attached to the same release,
# so they are covered by the same checksum manifest, signature and provenance.
#
# There is deliberately no hosted apt/yum repository -- that is explicitly out of
# scope in the ADR and is stated plainly in INSTALL.md, because users reasonably
# read "we ship a .deb" as "there is an apt repo".
nfpms:
  - id: repokeeper
    ids:
      - repokeeper
    package_name: repokeeper
    formats:
      - deb
      - rpm
    maintainer: "Skaphos <shawn@skaphos.io>"
    homepage: "https://github.com/skaphos/repokeeper"
    description: "Multi-repo workspace hygiene: inventory, drift reporting and safe sync, as a CLI or MCP server"
    license: "MIT"
    vendor: "Skaphos"
    section: "utils"
    bindir: /usr/bin
    # Conventional per-format naming: repokeeper_1.2.0_amd64.deb and
    # repokeeper-1.2.0-1.x86_64.rpm, rather than one shape forced onto both.
    file_name_template: "{{ .ConventionalFileName }}"
    contents:
      - src: LICENSE
        dst: /usr/share/doc/repokeeper/LICENSE
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/repokeeper/THIRD_PARTY_NOTICES.md
      - src: third_party_licenses
        dst: /usr/share/doc/repokeeper/third_party_licenses

checksum:
  name_template: "checksums.txt"

sboms:
  - id: archives
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"
  # Packages do not inherit the archive SBOM: they are separate artifacts and
  # need their own, or the .deb/.rpm ship without one. An archives-only config
  # looks complete and is not.
  - id: packages
    artifacts: package
    documents:
      - "{{ .ArtifactName }}.sbom.json"

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

# Multi-arch container image. Required for Shape 3 (MCP server) by
# skaphos-resources DECISIONS/0001, so `repokeeper mcp` can be run from a
# docker-based MCP client configuration.
#
# dockers_v2 builds a buildx manifest from the binaries GoReleaser has already
# built, rather than compiling inside the Dockerfile. That is what keeps the
# image part of the single release invocation: it fails as a unit with every
# other channel, and it ships the same signed bytes as the archives.
dockers_v2:
  - id: repokeeper
    ids:
      - repokeeper
    images:
      - ghcr.io/skaphos/repokeeper
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: "repokeeper"
      org.opencontainers.image.description: "Multi-repo workspace hygiene: inventory, drift reporting and safe sync, as a CLI or MCP server"
      org.opencontainers.image.url: "https://github.com/skaphos/repokeeper"
      org.opencontainers.image.source: "https://github.com/skaphos/repokeeper"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: "MIT"

changelog:
  disable: true

release:
  draft: false
  make_latest: true
  footer: |
    See [CHANGELOG.md](https://github.com/skaphos/repokeeper/blob/{{ .Tag }}/CHANGELOG.md) for the full release notes.

homebrew_casks:
  - repository:
      owner: skaphos
      name: homebrew-tools
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/skaphos/repokeeper"
    description: "Track and manage many Git repositories from a single config"
    license: "MIT"
    binaries:
      - repokeeper
    custom_block: |
      postflight do
        if OS.mac?
          system_command "/usr/bin/xattr",
                         args: ["-dr", "com.apple.quarantine", "#{staged_path}/repokeeper"]
        end
      end

snapshot:
  version_template: "{{ .Tag }}-next"
