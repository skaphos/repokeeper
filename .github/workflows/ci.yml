name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for all jobs. Every job only reads the repo
# (checkout, build, test, lint); artifact uploads and step summaries do not
# require token scopes. Grant narrower per-job permissions if a job ever needs
# more (e.g. contents: write for releases).
permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on PR commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin "${BASE_REF}:${BASE_REF}"
          missing=0
          while IFS= read -r commit; do
            [ -z "$commit" ] && continue
            if ! git log -1 --pretty=%B "$commit" | grep -qi '^Signed-off-by: '; then
              echo "Missing Signed-off-by trailer: $commit"
              missing=1
            fi
          done < <(git rev-list --no-merges "origin/${BASE_REF}..HEAD")

          if [ "$missing" -ne 0 ]; then
            echo "DCO check failed. Rebase/amend with: git commit --signoff"
            exit 1
          fi

  reuse:
    name: REUSE
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Install REUSE tool
        run: python -m pip install --upgrade pip reuse
      - name: Run REUSE lint
        run: reuse lint

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run lint task
        run: go -C tools tool task lint

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run coverage test task
        run: go -C tools tool task test-cover
      - name: Debug internal/config on failure
        if: failure()
        run: go test -v -count=1 ./internal/config || true
      - name: Check coverage
        if: matrix.os == 'ubuntu-24.04'
        run: |
          ./scripts/check-coverage.sh coverage.out
      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-24.04' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 30

  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run integration test task
        run: go -C tools tool task test-integration

  integration-race:
    name: Integration Race
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run integration race task
        run: go -C tools tool task test-integration-race

  compatibility-matrix:
    name: Routine Compatibility Matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: matrix
        name: Expand the declared routine matrix
        shell: bash
        run: echo "matrix=$(go run -tags integration ./test/e2e/cmd/compatibility matrix --scope routine)" >> "$GITHUB_OUTPUT"

  compatibility:
    name: Compatibility / ${{ matrix.cell.key }}
    needs: compatibility-matrix
    runs-on: ${{ matrix.cell.runner_label }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.compatibility-matrix.outputs.matrix).cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Record runner and source identity
        shell: bash
        env:
          CELL: ${{ matrix.cell.key }}
          RUNNER_IMAGE: ${{ runner.os }}-${{ runner.arch }}
        run: printf 'cell=%s\nrunner=%s\ncommit=%s\n' "$CELL" "$RUNNER_IMAGE" "$GITHUB_SHA"
      - name: Provision and exactly verify declared Git
        shell: bash
        env:
          CELL: ${{ matrix.cell.key }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/repokeeper-${CELL}"
          go run -tags integration ./test/e2e/cmd/compatibility provision --cell "$CELL" --prefix "$prefix" > "$RUNNER_TEMP/provision.json"
          git_path="$(jq -r .git_path "$RUNNER_TEMP/provision.json")"
          go run -tags integration ./test/e2e/cmd/compatibility verify-version --cell "$CELL" --git "$git_path"
          if [[ "$CELL" != wsl-* ]]; then
            dirname "$git_path" >> "$GITHUB_PATH"
          fi
      - name: Run native compatibility E2E
        if: matrix.cell.environment != 'wsl'
        run: go test -v -count=1 -timeout 10m -tags integration ./test/e2e
      - name: Cross-compile and run WSL compatibility E2E
        if: matrix.cell.environment == 'wsl'
        shell: bash
        run: |
          set -euo pipefail
          windows_to_wsl() {
            local windows_path="$1"
            local drive="${windows_path:0:1}"
            local tail="${windows_path:2}"
            tail="${tail//\\//}"
            printf '/mnt/%s%s' "${drive,,}" "$tail"
          }
          distribution="$(jq -r .wsl_distribution "$RUNNER_TEMP/provision.json")"
          repo_linux="$(windows_to_wsl "$GITHUB_WORKSPACE")"
          binary_windows="$RUNNER_TEMP/repokeeper-e2e-product"
          test_windows="$RUNNER_TEMP/repokeeper-e2e.test"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$binary_windows" .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -tags integration -o "$test_windows" ./test/e2e
          binary_linux="$(windows_to_wsl "$binary_windows")"
          test_linux="$(windows_to_wsl "$test_windows")"
          wsl.exe -d "$distribution" -- env \
            PATH="/opt/repokeeper-git/bin:/usr/bin:/bin" \
            REPOKEEPER_E2E_BINARY="$binary_linux" \
            REPOKEEPER_E2E_MODULE_ROOT="$repo_linux" \
            "$test_linux" -test.v
      - name: Unregister WSL distribution
        if: always() && matrix.cell.environment == 'wsl'
        shell: bash
        run: |
          distribution="$(jq -r '.wsl_distribution // empty' "$RUNNER_TEMP/provision.json" 2>/dev/null || true)"
          if [ -n "$distribution" ]; then wsl.exe --unregister "$distribution"; fi

  quality:
    name: Static Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run staticcheck task
        run: go -C tools tool task staticcheck
      - name: Run vulnerability task
        run: go -C tools tool task vuln

  perf:
    name: Performance Benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run quick benchmark baseline (pull request)
        if: github.event_name == 'pull_request'
        run: go -C tools tool task perf-bench-quick
      - name: Run full benchmark (push to main)
        if: github.event_name == 'push'
        run: go -C tools tool task perf-bench
      - name: Upload performance artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-${{ github.sha }}
          path: |
            perf/history.jsonl
            perf/runs/*.txt
          if-no-files-found: error
          retention-days: 30

  # Validates the release configuration and the published MCP registry entry.
  # Both describe artifacts consumed by people and tools outside this repository,
  # so a mistake in either fails at release time -- or worse, publishes something
  # wrong. Catching it in the pull request is the whole point.
  manifests:
    name: Release Manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned to the version release.yml actually releases with, and that
          # .tool-versions pins locally. A floating "~> v2" could validate the
          # config against a different GoReleaser than the one that runs it.
          version: v2.17.1
          install-only: true
      - name: Validate .goreleaser.yaml
        run: goreleaser check
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Install check-jsonschema
        # Pinned to the same version as .tool-versions, so a local run and CI
        # validate against the same tool.
        run: python -m pip install --upgrade pip 'check-jsonschema==0.38.0'
      - name: Validate server.json against the MCP registry schema
        run: |
          check-jsonschema \
            --schemafile https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json \
            server.json

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [dco, reuse, lint, test, integration, integration-race, compatibility, quality, perf, manifests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          install-only: true
      - name: Run CI build task
        run: go -C tools tool task -d .. build-ci

  summary:
    name: CI Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [dco, reuse, lint, test, integration, integration-race, compatibility, quality, perf, manifests, build]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Publish workflow summary
        env:
          DCO_RESULT: ${{ needs.dco.result }}
          REUSE_RESULT: ${{ needs.reuse.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          INTEGRATION_RACE_RESULT: ${{ needs.integration-race.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PERF_RESULT: ${{ needs.perf.result }}
          MANIFESTS_RESULT: ${{ needs.manifests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          total=11
          success=0
          failed=0
          skipped=0
          cancelled=0

          for result in "$DCO_RESULT" "$REUSE_RESULT" "$LINT_RESULT" "$TEST_RESULT" "$INTEGRATION_RESULT" "$INTEGRATION_RACE_RESULT" "$COMPATIBILITY_RESULT" "$QUALITY_RESULT" "$PERF_RESULT" "$MANIFESTS_RESULT" "$BUILD_RESULT"; do
            case "$result" in
              success) success=$((success + 1)) ;;
              failure) failed=$((failed + 1)) ;;
              skipped) skipped=$((skipped + 1)) ;;
              cancelled) cancelled=$((cancelled + 1)) ;;
              *) failed=$((failed + 1)) ;;
            esac
          done

          {
            echo "## CI Summary"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| dco | $DCO_RESULT |"
            echo "| reuse | $REUSE_RESULT |"
            echo "| lint | $LINT_RESULT |"
            echo "| test | $TEST_RESULT |"
            echo "| integration | $INTEGRATION_RESULT |"
            echo "| integration-race | $INTEGRATION_RACE_RESULT |"
            echo "| compatibility | $COMPATIBILITY_RESULT |"
            echo "| quality | $QUALITY_RESULT |"
            echo "| perf | $PERF_RESULT |"
            echo "| manifests | $MANIFESTS_RESULT |"
            echo "| build | $BUILD_RESULT |"
            echo
            echo "- Total jobs: $total"
            echo "- Success: $success"
            echo "- Failed: $failed"
            echo "- Skipped: $skipped"
            echo "- Cancelled: $cancelled"
            if [ "$failed" -gt 0 ]; then
              echo
              echo "### Key Failures"
              if [ "$DCO_RESULT" = "failure" ]; then echo "- dco failed"; fi
              if [ "$REUSE_RESULT" = "failure" ]; then echo "- reuse failed"; fi
              if [ "$LINT_RESULT" = "failure" ]; then echo "- lint failed"; fi
              if [ "$TEST_RESULT" = "failure" ]; then echo "- test failed"; fi
              if [ "$INTEGRATION_RESULT" = "failure" ]; then echo "- integration failed"; fi
              if [ "$INTEGRATION_RACE_RESULT" = "failure" ]; then echo "- integration-race failed"; fi
              if [ "$COMPATIBILITY_RESULT" = "failure" ]; then echo "- compatibility failed"; fi
              if [ "$QUALITY_RESULT" = "failure" ]; then echo "- quality failed"; fi
              if [ "$PERF_RESULT" = "failure" ]; then echo "- perf failed"; fi
              if [ "$MANIFESTS_RESULT" = "failure" ]; then echo "- manifests failed"; fi
              if [ "$BUILD_RESULT" = "failure" ]; then echo "- build failed"; fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
