name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  compatibility-matrix:
    name: Full Compatibility Matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: matrix
        name: Expand all twelve declared cells
        shell: bash
        run: echo "matrix=$(go run -tags integration ./test/e2e/cmd/compatibility matrix --scope release)" >> "$GITHUB_OUTPUT"

  compatibility-qualification:
    name: Qualify / ${{ matrix.cell.key }}
    needs: compatibility-matrix
    runs-on: ${{ matrix.cell.runner_label }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.compatibility-matrix.outputs.matrix).cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Record runner, tag, and commit identity
        shell: bash
        env:
          CELL: ${{ matrix.cell.key }}
          RUNNER_IDENTITY: ${{ runner.os }}-${{ runner.arch }}
        run: printf 'cell=%s\nrunner=%s\ntag=%s\ncommit=%s\n' "$CELL" "$RUNNER_IDENTITY" "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - id: provision
        name: Provision and exactly verify immutable Git inputs
        continue-on-error: true
        shell: bash
        env:
          CELL: ${{ matrix.cell.key }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/repokeeper-${CELL}"
          go run -tags integration ./test/e2e/cmd/compatibility provision --cell "$CELL" --prefix "$prefix" > "$RUNNER_TEMP/provision.json"
          git_path="$(jq -r .git_path "$RUNNER_TEMP/provision.json")"
          go run -tags integration ./test/e2e/cmd/compatibility verify-version --cell "$CELL" --git "$git_path"
          # git_path comes from filepath.Join, so Windows cells report
          # backslashes. POSIX dirname would see no separator and answer ".",
          # silently qualifying the release against the runner Git.
          if [[ "$CELL" != wsl-* ]]; then printf '%s\n' "$(dirname "${git_path//\\//}")" >> "$GITHUB_PATH"; fi
      - id: native-e2e
        name: Run native E2E suite
        if: matrix.cell.environment != 'wsl' && steps.provision.outcome == 'success'
        continue-on-error: true
        run: go test -v -count=1 -timeout 10m -tags integration ./test/e2e
      - id: wsl-e2e
        name: Cross-compile and run the E2E suite inside WSL1
        if: matrix.cell.environment == 'wsl' && steps.provision.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          windows_to_wsl() {
            local windows_path="$1"
            local drive="${windows_path:0:1}"
            local tail="${windows_path:2}"
            tail="${tail//\\//}"
            printf '/mnt/%s%s' "${drive,,}" "$tail"
          }
          distribution="$(jq -r .wsl_distribution "$RUNNER_TEMP/provision.json")"
          repo_linux="$(windows_to_wsl "$GITHUB_WORKSPACE")"
          binary_windows="$RUNNER_TEMP/repokeeper-e2e-product"
          compatibility_windows="$RUNNER_TEMP/repokeeper-compatibility"
          test_windows="$RUNNER_TEMP/repokeeper-e2e.test"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$binary_windows" .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags integration -o "$compatibility_windows" ./test/e2e/cmd/compatibility
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -tags integration -o "$test_windows" ./test/e2e
          binary_linux="$(windows_to_wsl "$binary_windows")"
          compatibility_linux="$(windows_to_wsl "$compatibility_windows")"
          test_linux="$(windows_to_wsl "$test_windows")"
          MSYS2_ARG_CONV_EXCL='*' wsl.exe -d "$distribution" -- env \
            PATH="/opt/repokeeper-git/bin:/usr/bin:/bin" \
            REPOKEEPER_E2E_BINARY="$binary_linux" \
            REPOKEEPER_E2E_COMPATIBILITY_BINARY="$compatibility_linux" \
            REPOKEEPER_E2E_MODULE_ROOT="$repo_linux" \
            "$test_linux" -test.v
      - id: evidence
        name: Write bounded per-cell evidence
        if: always()
        shell: bash
        env:
          CELL: ${{ matrix.cell.key }}
          ENVIRONMENT: ${{ matrix.cell.environment }}
          PROVISION_OUTCOME: ${{ steps.provision.outcome }}
          NATIVE_OUTCOME: ${{ steps.native-e2e.outcome }}
          WSL_OUTCOME: ${{ steps.wsl-e2e.outcome }}
        run: |
          set -euo pipefail
          status=failed
          if [ "$PROVISION_OUTCOME" = success ]; then
            if { [ "$ENVIRONMENT" = wsl ] && [ "$WSL_OUTCOME" = success ]; } || { [ "$ENVIRONMENT" != wsl ] && [ "$NATIVE_OUTCOME" = success ]; }; then
              status=passed
            fi
          fi
          actual_git="$(jq -r '.actual_version // ""' "$RUNNER_TEMP/provision.json" 2>/dev/null || true)"
          mkdir -p evidence
          go run -tags integration ./test/e2e/cmd/compatibility write-evidence \
            --cell "$CELL" --output "evidence/${CELL}.json" \
            --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --actual-git "$actual_git" --status "$status"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload cell evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-${{ matrix.cell.key }}
          path: evidence/${{ matrix.cell.key }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Unregister the job-owned WSL distribution
        if: always() && matrix.cell.environment == 'wsl'
        shell: bash
        run: |
          distribution="$(jq -r '.wsl_distribution // empty' "$RUNNER_TEMP/provision.json" 2>/dev/null || true)"
          if [ -n "$distribution" ]; then wsl.exe --unregister "$distribution"; fi
      - name: Enforce cell success after evidence upload
        if: always() && steps.evidence.outputs.status != 'passed'
        shell: bash
        run: exit 1

  compatibility-evidence:
    name: Compatibility Evidence Gate
    needs: [compatibility-matrix, compatibility-qualification]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Download every available cell artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: compatibility-*
          merge-multiple: true
          path: evidence
      - name: Require the exact successful twelve-cell evidence set
        run: go run -tags integration ./test/e2e/cmd/compatibility verify-evidence --directory evidence --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"

  release:
    name: GoReleaser
    needs: compatibility-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The container image is built for linux/amd64 and linux/arm64 inside the
      # same GoReleaser invocation as every other channel, so a failure to
      # publish it fails the release as a unit.
      - name: Set up QEMU for cross-architecture builds
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Mint Homebrew app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: skaphos
          repositories: homebrew-tools
          skip-token-revoke: false
      - name: Run full performance benchmarks
        run: go -C tools tool task -d .. perf-bench
      - name: Upload performance artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-release-${{ github.ref_name }}
          path: |
            perf/history.jsonl
            perf/runs/*.txt
          if-no-files-found: warn
          retention-days: 90
      - name: Restore perf history to clean state
        run: git restore perf/history.jsonl
      # A missing or unusable credential fails the release rather than silently
      # dropping the channel it belongs to.
      #
      # This step replaces one that emitted --skip=homebrew with a ::warning::
      # and then completed green. That is the ADR-0007 incident encoded as
      # workflow logic: the cask sat pinned at 0.6.0 across two releases because
      # a run finished successfully while a channel quietly did not publish. A
      # release that half-lands must fail, not warn.
      - name: Verify the Homebrew tap credential
        shell: bash
        env:
          HOMEBREW_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          if [ -z "${HOMEBREW_TOKEN}" ]; then
            echo "::error title=Homebrew::The release bot token was not minted, so the cask cannot be published. Check RELEASE_BOT_CLIENT_ID and RELEASE_BOT_PRIVATE_KEY."
            exit 1
          fi

          if ! curl --silent --show-error --fail \
            --header "Authorization: Bearer ${HOMEBREW_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/repos/skaphos/homebrew-tools >/dev/null; then
            echo "::error title=Homebrew::The release bot token cannot reach skaphos/homebrew-tools, so the cask cannot be published. Check the GitHub App installation and its repository access."
            exit 1
          fi

          echo "Homebrew tap credential verified."
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # macOS notarization (cross-platform via quill). When these secrets are
          # unset the notarize block is auto-skipped, so the release still works.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Attest release metadata artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/*.sbom.json
            dist/*.sigstore.json

      # The MCP registry is the one channel exempt from failing the release as a
      # unit: DECISIONS/0001 records it as the least settled channel, where a
      # break is a smaller emergency than a broken cask. It is therefore
      # reported-on-failure rather than release-failing, and retryable without
      # cutting a new release.
      - name: Stamp the release version into server.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          tmp="$(mktemp)"

          # Fail loudly on a server.json with no packages rather than stamping
          # around it. `.packages[].version = $v` is unsafe two ways: a missing
          # key makes jq abort mid-write, and an empty array succeeds while
          # silently leaving every package version unstamped -- publishing an
          # entry whose package points at a tag that was never built.
          jq --exit-status --arg v "$version" '
            if ((.packages // []) | length) == 0 then
              error("server.json declares no packages; refusing to stamp an entry MCP clients cannot run")
            else
              .version = $v | .packages |= map(.version = $v)
            end
          ' server.json > "$tmp"

          # Only replace the checked-in file once a complete document exists.
          [ -s "$tmp" ] || { echo "::error title=MCP registry::stamping produced an empty server.json"; exit 1; }
          mv "$tmp" server.json
          echo "server.json stamped to ${version}"

      - name: Install mcp-publisher
        id: mcp_publisher_install
        continue-on-error: true
        run: |
          set -euo pipefail
          # Pinned deliberately: @latest would make releases non-reproducible
          # and could break a release when upstream changes. Bump on purpose.
          go install github.com/modelcontextprotocol/registry/cmd/mcp-publisher@v1.8.1

      - name: Publish to the MCP registry
        id: mcp_publish
        continue-on-error: true
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MCP_REGISTRY_KEY}" ]; then
            echo "::warning title=MCP registry::MCP_REGISTRY_KEY is not set; skipping registry publish."
            exit 1
          fi
          mcp-publisher login dns --domain skaphos.io --private-key "${MCP_REGISTRY_KEY}"
          mcp-publisher publish

      - name: Report MCP registry outcome
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.mcp_publish.outcome }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${PUBLISH_OUTCOME}" != "success" ]; then
            echo "::warning title=MCP registry::Publishing io.skaphos/repokeeper failed. The rest of the release is valid and complete; re-run this step to retry without cutting a new release. Check the skaphos.io TXT record (v=MCPv1; k=ed25519) and the MCP_REGISTRY_KEY secret -- both fail quietly."
          else
            echo "MCP registry entry published for ${TAG}."
          fi

  # Confirms each channel actually served the new version, by querying the
  # channel rather than trusting the publishing step's own report.
  #
  # The failure this exists to catch is not "the release job errored" -- that is
  # already visible. It is the release that completes green while a channel
  # quietly did not move, which is how RepoKeeper's own cask sat at 0.6.0 across
  # two releases (ADR-0007). Reachability is not the test: a cask still pinned to
  # the previous version responds perfectly well. The version it serves is the
  # test.
  verify:
    name: Verify Published Channels
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: release
    if: always() && needs.release.result == 'success'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image is inspected below. Org GHCR packages are private by default,
      # so without this the manifest check fails on a release that published
      # perfectly well -- a false negative on the exact channel this job exists
      # to confirm.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify release assets
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$assets"

          failed=0

          # Every platform is named individually. Matching a bare extension
          # would pass on a release that built one architecture and dropped the
          # rest -- which is the half-landed release this job exists to catch,
          # not something it should wave through.
          require() {
            if ! echo "$assets" | grep -qE "$1"; then
              echo "::error title=Release assets::No asset matching /$1/ in $TAG."
              failed=1
            fi
          }

          # Counts are asserted as well as presence. A missing SBOM leaves its
          # artifact silently unattested, and presence alone cannot detect that
          # when nine of ten were uploaded.
          require_count() {
            actual="$(echo "$assets" | grep -cE "$1" || true)"
            if [ "$actual" -ne "$2" ]; then
              echo "::error title=Release assets::Expected $2 assets matching /$1/, found $actual."
              failed=1
            fi
          }

          # Archives: 4 tar.gz (linux, darwin x amd64, arm64) + 2 zip (windows).
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            require "_${platform}\.tar\.gz$"
          done
          for platform in windows_amd64 windows_arm64; do
            require "_${platform}\.zip$"
          done
          require_count '\.tar\.gz$' 4
          require_count '\.zip$' 2

          # Linux packages: one .deb and one .rpm per architecture.
          require '_amd64\.deb$'
          require '_arm64\.deb$'
          require 'x86_64\.rpm$'
          require 'aarch64\.rpm$'
          require_count '\.deb$' 2
          require_count '\.rpm$' 2

          # SBOMs: one per archive (6) and one per package (4). The package
          # SBOMs come from a separate `sboms` entry in .goreleaser.yaml --
          # packages do not inherit the archive one, and the omission is silent.
          require_count '\.(tar\.gz|zip)\.sbom\.json$' 6
          require_count '\.(deb|rpm)\.sbom\.json$' 4

          # Checksum manifest and its signature.
          require '^checksums\.txt$'
          require '^checksums\.txt\.sigstore\.json$'

          [ "$failed" -eq 0 ] || exit 1
          echo "All required release assets are present, in the expected counts."

      - name: Verify the Homebrew cask serves this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          url="https://raw.githubusercontent.com/skaphos/homebrew-tools/main/Casks/repokeeper.rb"

          for attempt in 1 2 3 4 5; do
            cask="$(curl --silent --fail "$url" || true)"
            if echo "$cask" | grep -q "version \"${version}\""; then
              echo "Cask serves ${version}."
              exit 0
            fi
            echo "Attempt ${attempt}: cask does not yet serve ${version}; retrying."
            sleep $((attempt * 15))
          done

          echo "::error title=Homebrew::The cask in skaphos/homebrew-tools is not serving ${version}. It responded, but with a stale version -- this is the silent-staleness failure, not an outage."
          exit 1

      - name: Verify the container image manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          image="ghcr.io/skaphos/repokeeper:${version}"

          manifest=""
          for attempt in 1 2 3 4 5; do
            if manifest="$(docker buildx imagetools inspect "$image" --raw 2>/dev/null)"; then
              break
            fi
            echo "Attempt ${attempt}: ${image} not resolvable yet; retrying."
            sleep $((attempt * 15))
            manifest=""
          done

          if [ -z "${manifest:-}" ]; then
            echo "::error title=Container image::${image} is not resolvable."
            exit 1
          fi

          for platform in amd64 arm64; do
            if ! echo "$manifest" | jq -e --arg a "$platform" \
              '.manifests[]?.platform | select(.os == "linux" and .architecture == $a)' >/dev/null; then
              echo "::error title=Container image::${image} has no linux/${platform} entry in its manifest."
              exit 1
            fi
          done
          echo "${image} publishes linux/amd64 and linux/arm64."

      # Reported, never blocking: the registry is the one channel exempt from
      # failing the release as a unit.
      - name: Verify the MCP registry entry
        id: verify_registry
        continue-on-error: true
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          api="https://registry.modelcontextprotocol.io/v0/servers?search=io.skaphos/repokeeper"

          for attempt in 1 2 3; do
            body="$(curl --silent --fail "$api" || true)"
            if echo "$body" | jq -e --arg v "$version" \
              '.servers[]? | select(.version == $v)' >/dev/null 2>&1; then
              echo "Registry serves ${version}."
              exit 0
            fi
            echo "Attempt ${attempt}: registry does not yet serve ${version}; retrying."
            sleep $((attempt * 20))
          done

          echo "::warning title=MCP registry::io.skaphos/repokeeper is not serving ${version}. The rest of the release is valid; re-run the publish step to retry. Check the skaphos.io TXT record and MCP_REGISTRY_KEY."
          exit 1

      - name: Channel summary
        if: always()
        env:
          TAG: ${{ github.ref_name }}
          REGISTRY_OUTCOME: ${{ steps.verify_registry.outcome }}
        run: |
          {
            echo "## Published channels for ${TAG}"
            echo
            echo "| Channel | Blocking | Confirmed by querying |"
            echo "| --- | --- | --- |"
            echo "| Release assets | yes | GitHub release asset list |"
            echo "| Homebrew cask | yes | raw Casks/repokeeper.rb |"
            echo "| Container image | yes | buildx imagetools manifest, both arches |"
            echo "| MCP registry | no | registry search API — outcome: ${REGISTRY_OUTCOME} |"
            echo
            echo "Confirmation comes from querying each channel, never from the publishing step's own report."
          } >> "$GITHUB_STEP_SUMMARY"
